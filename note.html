<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nota</title>
  <link rel="stylesheet" href="notes.css" />
</head>
<body class="note-window" data-color="yellow">
  <header class="note-toolbar">
    <div class="note-colors" id="colors">
      <button class="dot" data-color="yellow" style="--c:#fff4b8" title="Amarillo"></button>
      <button class="dot" data-color="pink" style="--c:#ffd6e0" title="Rosa"></button>
      <button class="dot" data-color="blue" style="--c:#d6ecff" title="Azul"></button>
      <button class="dot" data-color="green" style="--c:#d6f5d6" title="Verde"></button>
      <button class="dot" data-color="gray" style="--c:#e9e9e9" title="Gris"></button>
    </div>
    <div class="note-actions">
      <span id="saved-state" class="saved-state">Guardado</span>
      <button id="delete-note" class="icon-btn danger" title="Eliminar nota">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </header>

  <input id="note-title" class="note-title" type="text" placeholder="Título" />
  <textarea id="note-body" class="note-body" placeholder="Escribe aquí…"></textarea>
  <footer class="note-footer"><span id="note-meta"></span></footer>

  <script src="notes-store.js"></script>
  <script src="note.js"></script>
</body>
</html>
